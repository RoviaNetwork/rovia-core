name: core-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: swift --version
      - run: |
          for p in core/config core/subscription core/routing engines/api; do
            echo "swift test --package-path $p"
            swift test --package-path "$p"
          done
